<canvas id="scene" tabindex="0" aria-label="瓶中海洋三维场景，可拖动旋转" data-aria-zh="瓶中海洋三维场景，可拖动旋转" data-aria-en="Ocean in a bottle, an interactive 3D scene. Drag to orbit."></canvas>
<header class="header">
<a id="back" href="/projects/bottle-ocean/" data-zh="返回作品" data-en="Back to the project">返回作品</a>
<div class="heading"><p class="overline" data-zh="玻璃里的远航" data-en="A SMALL SEA, A LONG VOYAGE">玻璃里的远航</p><h1 data-zh="微缩海洋" data-en="An ocean in a bottle">微缩海洋</h1><p class="intro" data-zh="一艘双桅帆船，几座小岛。潮水在玻璃里起伏，远方也可以很小。" data-en="A merchant brig, a few little islands. A whole voyage, held in glass.">一艘双桅帆船，几座小岛。潮水在玻璃里起伏，远方也可以很小。</p></div>
</header>
<footer class="footer"><p class="caption" data-zh="拖动环绕 · 滚轮或双指缩放\n方向键旋转 · + / − 缩放" data-en="Drag to orbit · Scroll or pinch to zoom\nArrow keys to rotate · + / − to zoom" style="white-space:pre-line">拖动环绕 · 滚轮或双指缩放
方向键旋转 · + / − 缩放</p><nav class="toolbar" aria-label="场景控制" data-aria-zh="场景控制" data-aria-en="Scene controls"><button id="motion" type="button" aria-pressed="true" data-zh="暂停" data-en="Pause">暂停</button><button id="reset" type="button" data-zh="复位" data-en="Reset">复位</button><button id="quality" type="button" aria-pressed="false" data-zh="轻量" data-en="Low detail">轻量</button><button id="help" type="button" aria-expanded="false" aria-controls="help-panel" data-zh="风与浪" data-en="Wind & waves">风与浪</button><button id="quiet" type="button" aria-pressed="false" data-zh="只看海" data-en="Hide interface">只看海</button></nav></footer>
<section id="help-panel" aria-labelledby="help-title" hidden><button id="close-help" type="button" aria-label="关闭" data-aria-zh="关闭" data-aria-en="Close">×</button><h2 id="help-title" data-zh="风与浪" data-en="Wind & waves">风与浪</h2><label class="range-label" for="waves"><span data-zh="浪高" data-en="Wave height">浪高</span><output id="waves-value" for="waves">60%</output></label><input id="waves" type="range" min="0" max="100" value="60" step="1"><label class="range-label" for="wind"><span data-zh="风力" data-en="Wind">风力</span><output id="wind-value" for="wind">45%</output></label><input id="wind" type="range" min="0" max="100" value="45" step="1"><p data-zh="浪高改变波幅，风力改变涌浪与短波的配比。船身采样同一片水面，以带阻尼的浮力响应升沉与倾斜。" data-en="Wave height sets the amplitude; wind changes the balance of swells and ripples. The hull samples this same sea, with damped buoyancy driving its movement.">浪高改变波幅，风力改变涌浪与短波的配比。船身采样同一片水面，以带阻尼的浮力响应升沉与倾斜。</p><p data-zh="暂停会停住海面与帆船，仍可自由转动视角。按 Esc 关闭此面板或恢复界面。" data-en="Pause holds the sea and ship still. You can always move the camera. Press Escape to close this panel or restore the interface.">暂停会停住海面与帆船，仍可自由转动视角。按 Esc 关闭此面板或恢复界面。</p></section>
<button id="restore" type="button" hidden data-zh="显示界面" data-en="Show interface">显示界面</button>
<div id="status" role="status" data-zh="正在装好这片海…" data-en="Preparing a little sea…">正在装好这片海…</div>
<div id="failure" role="alert" hidden><p data-zh="三维画面无法显示。请尝试重新打开页面，或返回作品页。" data-en="The 3D scene could not be displayed. Try reopening this page, or return to the project.">三维画面无法显示。请尝试重新打开页面，或返回作品页。</p><a id="failure-back" href="/projects/bottle-ocean/" data-zh="返回作品" data-en="Back to the project">返回作品</a></div>
